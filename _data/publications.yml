- id: jasb-2025
  year: 2025
  category: journal
  cv_group: first
  featured: true
  title: Improving multibreed genomic prediction for breeds with small populations by modeling heterogeneous genetic (co)variance blockwise accounting for linkage disequilibrium
  short_title:
    zh: 让小规模品种也能用好基因组预测
    en: Better genomic prediction for small-population breeds
  authors: '<strong>Li W</strong>, Li S, Du H, Huang Q, Zhuo Y, Zhou L, et al.'
  journal: Journal of Animal Science and Biotechnology
  volume: '16(1):176'
  doi: https://doi.org/10.1186/s40104-025-01303-9
  pdf: /files/JASB_2025-12-20_manuscript.pdf
  route:
    zh: /publication/2025-12-20-JASB
    en: /en/publication/2025-12-20-JASB/
  summary:
    zh: 用遗传信息帮助小规模品种提高预测准确性，让有限的数据发挥更大作用。
    en: A Bayesian model uses information across breeds to improve predictions for small populations.
  technical_summary:
    zh: 提出 mbBayesABLD，用 LD 区块显式建模异质遗传协方差，在多品种联合预测中提升小规模品种的基因组预测准确性。
    en: Models heterogeneous genetic covariance by LD blocks to improve multibreed genomic prediction, especially for small-population breeds.
  note:
    zh: IF=6.5，中科院一区 TOP
    en: IF=6.5, CAS Q1 TOP
- id: agriculture-2024
  year: 2024
  category: journal
  cv_group: first
  featured: true
  title: Multi-Trait Bayesian Models Enhance the Accuracy of Genomic Prediction in Multi-Breed Reference Populations
  short_title:
    zh: 让不同品种的数据互相帮忙
    en: Helping breeds learn from one another
  authors: '<strong>Li W</strong>, Zhang M, Du H, Wu J, Zhou L, Liu J.'
  journal: Agriculture
  volume: '14(4):626'
  doi: https://doi.org/10.3390/agriculture14040626
  pdf: /files/Agriculture_2024-04-16_manuscript.pdf
  route:
    zh: /publication/2024-04-16-Agriculture
    en: /en/publication/2024-04-16-Agriculture/
  summary:
    zh: 结合不同品种之间的联系，探索更准确的遗传评估方法。
    en: Multi-trait Bayesian models borrow information across breeds for more accurate prediction.
  technical_summary:
    zh: 将不同品种的同一性状视为遗传相关性状，结合区块异质协方差建模，提高多品种参考群体中的预测表现。
    en: Uses multi-trait Bayesian models and block-wise covariance modeling to improve genomic prediction in multibreed reference populations.
  note:
    zh: IF=3.6，中科院二区
    en: IF=3.6, CAS Q2
- id: animals-2022
  year: 2022
  category: journal
  cv_group: first
  featured: true
  title: Genome-Wide Association Analysis and Genetic Parameters for Feed Efficiency and Related Traits in Yorkshire and Duroc Pigs
  short_title:
    zh: 从遗传数据里寻找饲料效率的线索
    en: Finding genetic clues to feed efficiency
  authors: '<strong>Li W</strong>, Wang Z, Luo S, Wu J, Zhou L, Liu J.'
  journal: Animals
  volume: '12(15):1902'
  doi: https://doi.org/10.3390/ani12151902
  pdf: /files/Animals_2022-07-26_manuscript.pdf
  route:
    zh: /publication/2022-07-26-Animals
    en: /en/publication/2022-07-26-Animals/
  summary:
    zh: 研究猪的生长与采食表现，寻找与饲料效率相关的遗传线索。
    en: Studies growth and feeding traits to identify genetic signals related to feed efficiency.
  technical_summary:
    zh: 估计猪饲料效率及相关性状的遗传参数，鉴定显著 SNP 和候选基因，为提高饲料效率提供遗传线索。
    en: Estimates genetic parameters and identifies SNPs and candidate genes related to feed efficiency traits in Yorkshire and Duroc pigs.
  note:
    zh: IF=3.2，中科院二区
    en: IF=3.2, CAS Q2
